<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06172B">
  <title>QOFER GROUP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #06172B;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 75%,
        #124D69 0%, #092A43 40%, #06172B 80%);
    }

    .glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: #12B879;
      filter: blur(120px);
      opacity: 0.13;
      animation: glow 5s ease-in-out infinite alternate;
    }

    .brand {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: reveal 1.5s ease both;
    }

    .logo {
      font-size: clamp(48px, 12vw, 100px);
      font-weight: 900;
      letter-spacing: 8px;
      color: #FFFFFF;
      text-shadow: 0 0 28px #4A91B566;
    }

    .logo span {
      color: #42D99A;
    }

    .line {
      width: 0;
      height: 2px;
      margin: 16px auto;
      background: linear-gradient(
        90deg, #35D69A, #FFFFFF, #9BAFC4
      );
      animation: lineOpen 1.5s ease 0.5s forwards;
    }

    .tagline {
      font-size: clamp(11px, 2.5vw, 17px);
      letter-spacing: 3px;
      color: #D9E5EF;
      opacity: 0;
      animation: reveal 1.2s ease 0.8s forwards;
    }

    .descriptor {
      margin-top: 12px;
      font-size: clamp(9px, 2vw, 13px);
      letter-spacing: 2px;
      color: #8DB5C8;
      opacity: 0;
      animation: reveal 1s ease 1.2s forwards;
    }

    .water {
      position: absolute;
      left: -50%;
      bottom: -20%;
      width: 200%;
      height: 48%;
      border-radius: 43% 47% 0 0;
      background: linear-gradient(
        180deg,
        #40D6A0 0%,
        #1388A8 22%,
        #12617E 55%,
        #0A3452 100%
      );
      opacity: 0.68;
      animation: wave 8s ease-in-out infinite alternate;
    }

    .water.two {
      bottom: -25%;
      height: 45%;
      background: linear-gradient(
        180deg,
        #DDEAF3 0%,
        #779EB6 15%,
        #17658A 50%,
        #092A43 100%
      );
      opacity: 0.36;
      animation: waveTwo 10s ease-in-out infinite alternate;
    }

    .water.three {
      bottom: -31%;
      height: 42%;
      background: #087E83;
      opacity: 0.38;
      animation: wave 12s ease-in-out infinite alternate-reverse;
    }

    .loading {
      position: absolute;
      bottom: 35px;
      z-index: 3;
      font-size: 10px;
      letter-spacing: 4px;
      color: #C8D8E5;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes wave {
      from { transform: rotate(-5deg) translateX(-3%); }
      to   { transform: rotate(5deg) translateX(3%); }
    }

    @keyframes waveTwo {
      from { transform: rotate(4deg) translateX(3%); }
      to   { transform: rotate(-4deg) translateX(-3%); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes lineOpen {
      to { width: 100%; }
    }

    @keyframes glow {
      from { transform: scale(0.8); }
      to   { transform: scale(1.2); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="glow"></div>

    <div class="brand">
      <div class="logo">Q<span>O</span>FER</div>
      <div class="line"></div>
      <div class="tagline">
        ADVANCE BONDING. ABSOLUTE TRUST.
      </div>
      <div class="descriptor">
        LATEX POLYMERS &amp; CHEMICALS
      </div>
    </div>

    <div class="water"></div>
    <div class="water two"></div>
    <div class="water three"></div>

    <div class="loading">INNOVATING MATERIALS</div>
  </main>

  <script>
    // Show the animation for 5 seconds, then open QOFER's website.
    // Replace this URL if your main website address is different.
    const mainWebsite = "https://www.qofergroup.com/";

    setTimeout(function () {
      window.location.replace(mainWebsite);
    }, 5000);
  </script>
</body>
</html>
